<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Armá tu llavero OLED</title>
  <meta name="description" content="Elegí tu nombre y tu cara, grabá el llavero por USB y descargá la carcasa para imprimir.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%237FB2E5%22/%3E%3Crect x=%223%22 y=%227%22 width=%2210%22 height=%226%22 fill=%22%23161616%22/%3E%3Crect x=%224%22 y=%228%22 width=%228%22 height=%221%22 fill=%22%23FFD23F%22/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/archivo/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra-contenido">
      <span class="marca">
        <svg viewBox="0 0 20 24" aria-hidden="true"><rect x="7" y="0" width="6" height="5" rx="3" fill="#7FB2E5"/><rect x="0" y="3" width="20" height="21" rx="3" fill="#7FB2E5"/><rect x="3" y="12" width="14" height="8" rx="1" fill="#161616"/><rect x="5" y="14" width="10" height="1.4" fill="#FFD23F"/><rect x="5" y="16.5" width="7" height="1.6" fill="#3FC3FF"/></svg>
        Llavero OLED
      </span>
      <a href="https://github.com/popertoelpoperon/llavero-oled">Código en GitHub</a>
    </div>
  </header>

  <div class="pagina">
    <div class="taller">
      <header class="cabecera">
        <h1>Armá tu llavero OLED</h1>
        <p>Elegí tu nombre y tu cara, grabalo por USB y descargá la carcasa para imprimirla.</p>
      </header>

      <figure class="vista-gafete">
        <div class="gafete" aria-hidden="true">
          <div class="argolla"></div>
          <div class="cuerpo">
            <img class="medallon" src="datos/medallon.svg" alt="">
            <div class="visor"><canvas id="pantalla" width="256" height="132"></canvas></div>
          </div>
        </div>
        <figcaption id="leyenda">Así se va a ver tu llavero.</figcaption>
      </figure>

      <main class="pasos">
        <div id="progreso"></div>
        <section id="paso" aria-live="polite"></section>
        <nav id="navegacion">
          <button id="atras" type="button" class="secundario">Atrás</button>
          <button id="siguiente" type="button" class="principal">Siguiente</button>
        </nav>
      </main>
    </div>

    <footer class="pie"><p>Hecho por PO</p></footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
